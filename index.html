<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الرياضيات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#063d2c;--bio:#ff2e7e;--phy:#22e6ff;--mat:#c6ff5e;--vio:#8b5cf6;--text:#eaf6ff;--dim:#7d92b3;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Cairo',sans-serif;color:var(--text);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:fadein .7s ease}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
/* intro */
#intro{justify-content:center;text-align:center;padding:20px}
.orb{position:relative;width:170px;height:170px;margin-bottom:22px}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid;animation:spin 6s linear infinite}
.orb i:nth-child(1){border-color:var(--bio) transparent transparent transparent;box-shadow:0 0 22px var(--bio)}
.orb i:nth-child(2){inset:16px;border-color:transparent var(--phy) transparent transparent;box-shadow:0 0 22px var(--phy);animation-duration:4.5s;animation-direction:reverse}
.orb i:nth-child(3){inset:32px;border-color:transparent transparent var(--mat) transparent;box-shadow:0 0 22px var(--mat);animation-duration:3.2s}
.orb b{position:absolute;inset:58px;border-radius:50%;background:radial-gradient(circle,#fff,var(--vio) 60%,transparent 72%);animation:pulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}
h1{margin:0;font-size:clamp(34px,10vw,54px);font-weight:800;color:#fff;text-shadow:0 0 14px var(--phy),0 0 34px var(--vio),0 0 60px var(--bio);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 18px var(--bio),0 0 40px var(--phy),0 0 70px var(--mat)}}
.tag{margin:10px 0 26px;color:var(--dim);font-size:clamp(13px,3.6vw,16px);line-height:1.8}
.tag span:nth-child(1){color:var(--bio)}.tag span:nth-child(2){color:var(--phy)}.tag span:nth-child(3){color:var(--mat)}
.big{font-family:inherit;font-weight:800;font-size:18px;color:#04101a;border:none;padding:14px 38px;border-radius:40px;cursor:pointer;background:linear-gradient(135deg,var(--phy),var(--vio),var(--bio));background-size:200% 200%;animation:grad 4s ease infinite;box-shadow:0 0 28px rgba(139,92,246,.6)}
@keyframes grad{50%{background-position:100% 50%}}
/* menu */
#menu{justify-content:flex-start;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);overflow-y:auto}
#menu h2{margin:8px 0 2px;font-size:26px;font-weight:800;text-shadow:0 0 16px var(--phy)}
#menu p{margin:0 0 14px;color:var(--dim);font-size:13px}
.card{position:relative;width:min(100%,440px);margin:8px 0;padding:14px 16px;border-radius:22px;display:flex;align-items:center;gap:14px;cursor:pointer;overflow:hidden;background:rgba(255,255,255,.045);border:1.5px solid var(--c);animation:cg 3s ease-in-out infinite;backdrop-filter:blur(4px)}
.card::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{to{left:130%}}
@keyframes cg{50%{box-shadow:0 0 26px var(--c)}0%,100%{box-shadow:0 0 8px var(--c)}}
.card:active{transform:scale(.98)}
.card svg{width:72px;height:72px;flex:none;filter:drop-shadow(0 0 8px var(--c))}
.card h3{margin:0;font-size:21px;font-weight:800;color:var(--c);text-shadow:0 0 10px var(--c)}
.card small{color:var(--dim);font-size:12.5px;line-height:1.6;display:block;margin-top:2px}
.card em{font-style:normal;font-size:12px;color:var(--c);font-weight:600}
.heart{transform-origin:12px 12px;animation:beat 1s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.sweep{transform-origin:36px 36px;animation:spin 3s linear infinite}
.tri{stroke-dasharray:200;animation:draw 3s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:200}55%,100%{stroke-dashoffset:0}}
/* voice */
.vbtn{position:fixed;top:calc(var(--sat) + 10px);left:12px;z-index:30;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--phy);background:rgba(4,44,32,.95);color:#fff;font-size:19px;cursor:pointer}
/* view */
#view{background:var(--bg);justify-content:flex-start}
.bar{width:100%;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 8px) 12px 8px;border-bottom:1px solid var(--c);background:rgba(4,44,32,.95);position:relative;z-index:5}
.bar h4{margin:0;flex:1;font-size:17px;font-weight:800;color:var(--c);text-shadow:0 0 10px var(--c)}
.back{font-family:inherit;font-weight:600;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--c);border-radius:20px;padding:6px 14px;cursor:pointer}
#view .vbtn{position:static;width:38px;height:38px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.askbtn{flex:none;height:38px;padding:0 14px;border-radius:20px;border:none;font-family:inherit;font-weight:800;font-size:13px;color:#04101a;background:linear-gradient(135deg,var(--phy),var(--vio));box-shadow:0 0 14px rgba(34,230,255,.55);cursor:pointer;white-space:nowrap}
.sheetWrap{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(2,3,8,.55);padding:0 10px calc(var(--sab) + 14px)}
.sheetWrap.open{display:flex}
.sheet{width:100%;max-width:420px;max-height:min(64vh,520px);overflow-y:auto;background:rgba(5,52,38,.98);border:1.5px solid var(--c);border-radius:22px;padding:12px 14px calc(var(--sab) + 12px);box-shadow:0 -6px 34px rgba(0,0,0,.55);transform:translateY(16px) scale(.98);opacity:0;transition:transform .28s ease,opacity .28s ease}
.sheetWrap.open .sheet{transform:none;opacity:1}
.sh{display:flex;align-items:center;justify-content:space-between;font-weight:800;color:var(--c)}
.sh button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{font-family:inherit;font-size:12.5px;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--c);border-radius:18px;padding:6px 12px;cursor:pointer}
#ans{min-height:54px;max-height:34vh;overflow-y:auto;background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.85;margin-bottom:10px;white-space:pre-wrap}
.in{display:flex;gap:8px}
.in input{flex:1;font-family:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--c);border-radius:22px;padding:10px 14px;outline:none;min-width:0}
.in button{font-family:inherit;font-weight:800;border:none;border-radius:22px;padding:0 16px;color:#04101a;background:var(--c);cursor:pointer;font-size:15px}
#flash{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,var(--c),transparent 65%);pointer-events:none}
#flash.go{display:flex;animation:fl 1s ease forwards}
@keyframes fl{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
#flash span{font-size:60px;filter:drop-shadow(0 0 20px #fff)}
.card .ic{font-size:40px;width:72px;text-align:center;flex:none}.card h3{font-size:16px;line-height:1.5}.nb{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:50%;background:var(--c);color:#04101a;text-align:center;font-size:14px;margin-left:6px;text-shadow:none}#grid{display:flex;flex-direction:column;align-items:center;width:100%}.bar{gap:6px;padding-left:8px;padding-right:8px}.bar h4{display:none}.bar .back{flex:none;margin-inline-end:auto;padding:6px 12px}.bar .askbtn{flex:none;height:38px;padding:0 12px;font-size:15px}.bar .vbtn{position:static;flex:none;width:38px;height:38px;font-size:17px}</style>

<canvas id="bg"></canvas>

<section class="screen on" id="intro">
  <div class="orb"><i></i><i></i><i></i><b></b></div>
  <h1>مختبر الرياضيات</h1>
  <div class="tag">الرياضيات • ١٠ محاكاة وبرامج تفاعلية<br>بقوة الذكاء الاصطناعي</div>
  <button class="big" id="startBtn">ابدأ الرحلة ▶</button>
</section>

<section class="screen" id="menu"><h2>مختبر الرياضيات</h2><p>١٠ تجارب تفاعلية، ومعها مساعد ذكي يجيب أسئلتك</p><div id="grid"></div></section>

<section class="screen" id="view">
  <div class="bar"><button class="back" id="backBtn">▶ رجوع</button><h4 id="vt"></h4><button class="askbtn" id="fab">🤖 اسأل</button><button class="vbtn" id="vv2">🔊</button></div>
  <iframe id="fr" allow="autoplay"></iframe>

<div class="sheetWrap" id="sheetWrap">

  <div id="ans">اختر سؤالاً أو اكتب سؤالك...</div>

let voices=[],bestVoice=null;function lv(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];pickVoice();}

function pickVoice(){const ar=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ar'));if(!ar.length){bestVoice=null;return;}
 const priority=[/naayf/i,/hamed/i,/majed/i,/omar/i,/youssef|yousef/i,/khalid/i,/tarek/i,/karim/i,/fahd/i];
 for(const p of priority){const v=ar.find(v=>p.test(v.name));if(v){bestVoice=v;return;}}
 const notFemale=ar.find(v=>!/female|zeina|salma|laila|hoda|amira|zariah/i.test(v.name));
 bestVoice=notFemale||ar[0];}

async function askWorker(q,ctxText,signal){
  const r=await fetch(WORKER_URL,{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q+"\n\n(تعليمات الصوت: بعد انتهاء جوابك اكتب في سطر منفصل العلامة ###نطق### ثم أعد كتابة الجواب نفسه بالعربية الفصحى المبسطة ومشكَّلاً بالكامل بالحركات الصحيحة على كل الحروف، واكتب الأرقام والرموز والمصطلحات الأجنبية بالحروف العربية كما تُنطق، بلا أي رموز أو تنسيق أو إيموجي.)",context:ctxText})});
  let data=null;try{data=await r.json();}catch(e){}
  if(!r.ok)throw new Error('HTTP '+r.status+' — '+(data&&data.text?data.text:'(بدون تفاصيل من السيرفر)'));
  if(!data||!data.text)throw new Error('رد فاضي من السيرفر');
  const pp=data.text.split(/#{2,}\s*نطق\s*#{2,}/);window.__sp=(pp[1]||'').trim()||null;return pp[0].trim();
}
async function ask(q,fallback){
  if(!q.trim())return;ans.textContent='المساعد يفكر...';
  const m=META[cur];
  if(ctrl)ctrl.abort();ctrl=new AbortController();
  const useWorker=WORKER_URL&&!WORKER_URL.includes('YOUR-WORKER');
  if(useWorker){
    try{const text=await askWorker(q,m.ctx,ctrl.signal);ans.textContent=text;say(window.__sp||text);return;}
    catch(e){if(e&&e.name==='AbortError')return;
      const dbg='خطأ Worker (تشخيص مؤقت): '+(e&&e.message?e.message:String(e));
      ans.textContent=dbg;return;}
  }
  let s=null;try{if(window.claude&&claude.use)s=await claude.use('sample');}catch(e){}
  if(!s){const a=fallback||'المساعد الحي غير متاح الآن. جرّب أحد الأسئلة الجاهزة أعلاه.';ans.textContent=a;say(a);return;}
  try{
    const persona='أنت Paradox، مساعد ذكاء اصطناعي ذكي وواثق وعنده خفة دم خفيفة، تشرح داخل عرض جامعي تفاعلي لطلاب الابتدائية والمتوسطة في العراق. مباشر وما تكثر الحشو، بس ودود مع الأطفال. إذا الطالب كتب بالعامية العراقية جاوبه بالعامية العراقية البسيطة، وإذا كتب فصيح جاوبه فصيح.';
    const p=persona+'\n\nالقسم الحالي: '+m.ctx+'\nأجب بجمل قصيرة (3 إلى 5 جمل)، مع مثال واقعي، وأشر إلى علاقة الموضوع بالذكاء الاصطناعي عند المناسبة. لا تستخدم رموز تنسيق أو نجوم. إن كان السؤال بعيداً عن العلم فوجّه الطالب بلطف للقسم.\n\nسؤال الطالب: '+q;
    const r=await s([{role:'user',content:p}],{cache:false,signal:ctrl.signal,onText:({text})=>{ans.textContent=text;}});
    ans.textContent=r.text;say(r.text);
  }catch(e){if(e&&e.code==='cancelled')return;const a=fallback||'تعذر الوصول للمساعد الآن، حاول مرة ثانية.';ans.textContent=a;say(a);}
}

const cv=$('bg'),ctx=cv.getContext('2d');let W,H,paused=false;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
const cols=["#c6ff5e", "#ffd84d", "#ffffff", "#5eead4"];
const ps=Array.from({length:55},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0004,vy:(Math.random()-.5)*.0004,c:cols[Math.floor(Math.random()*4)],r:1+Math.random()*2}));
(function loop(t){requestAnimationFrame(loop);if(paused)return;
  ctx.fillStyle='#063d2c';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*.35,0,W/2,H*.35,H*.7);g.addColorStop(0,'rgba(198,255,94,.22)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // perspective grid
  ctx.strokeStyle='rgba(198,255,94,.2)';ctx.lineWidth=1;const hy=H*.62;
  for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(W/2+i*20,hy);ctx.lineTo(W/2+i*W*.16,H);ctx.stroke();}
  for(let j=0;j<9;j++){const y=hy+Math.pow(((j+(t/1500)%1)/9),2)*(H-hy);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // beams
  for(let b=0;b<3;b++){const a=Math.sin(t/2500+b*2)*.5+.5;ctx.strokeStyle=cols[b]+'22';ctx.lineWidth=40;ctx.beginPath();ctx.moveTo(W*(.2+b*.3),0);ctx.lineTo(W*(.5+Math.sin(t/3000+b)*.3),H);ctx.globalAlpha=a*.5;ctx.stroke();ctx.globalAlpha=1;}
  ps.forEach(p=>{p.x=(p.x+p.vx*16+1)%1;p.y=(p.y+p.vy*16+1)%1;ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,7);ctx.fill();});ctx.shadowBlur=0;
});

const eb=document.createElement('button');eb.className='askbtn';eb.textContent='✏️';eb.onclick=()=>{$('edN').value=META[cur].n;$('edS').value=META[cur].s;ed.style.display='flex'};
const vb=document.createElement('button');vb.className='askbtn';vb.textContent='🗣';vb.title='تغيير الصوت';vb.onclick=()=>{const n=window.arNextVoice&&arNextVoice();if(n)say('مرحباً بكم في المختبر. هذا هو الصوت المختار.');else alert('لا يوجد صوت عربي على هذا الجهاز')};
const bar=document.querySelector('.bar');bar.insertBefore(vb,$('fab'));bar.insertBefore(eb,$('fab'));
$('edX').onclick=()=>ed.style.display='none';
$('edOk').onclick=()=>{TXT[cur]={n:$('edN').value.trim()||ORIG[cur].n,s:$('edS').value.trim()||ORIG[cur].s};persist();applyTXT();buildGrid();reopen();ed.style.display='none'};
$('edRs').onclick=()=>{delete TXT[cur];persist();applyTXT();buildGrid();reopen();ed.style.display='none'};
$('edCp').onclick=()=>{const j=JSON.stringify(TXT,null,1);try{navigator.clipboard.writeText(j).then(()=>alert('تم النسخ ✔'))}catch(e){prompt('انسخ النص:',j)}};
function SUBJBG(kind,mode){var c=document.createElement('canvas');c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;border:0;border-radius:0;aspect-ratio:auto;background:none;box-shadow:none;'+(mode?'':'z-index:-1');
var x=c.getContext('2d'),W,H,dp=Math.min(window.devicePixelRatio||1,2);function rs(){W=innerWidth;H=innerHeight;c.width=W*dp;c.height=H*dp;x.setTransform(dp,0,0,dp,0,0)}rs();addEventListener('resize',rs);
var R=Math.random,TAU=6.283,S=[],i;function wr(v,m){return((v%m)+m)%m}
if(kind=='phy'){for(i=0;i<80;i++)S.push({x:R(),y:R(),r:.5+R()*1.5,sp:.5+R()*2,ph:R()*6});
 var PL=[{x:.15,y:.2,r:26,v:6,a:'#ffb86b',b:'#9a3412',ring:1},{x:.7,y:.12,r:16,v:-4,a:'#7fb5ff',b:'#1e3a8a'},{x:.5,y:.62,r:34,v:3,a:'#d8b4fe',b:'#5b21b6'}],FM=['E = mc²','F = ma','v = fλ','V = IR','Q = mcΔT','g = 9.8','W = Fd'],FS=FM.map(function(f,j){return{t:f,x:R(),y:R(),v:8+R()*10}})}
if(kind=='bio'){for(i=0;i<16;i++)S.push({x:R(),y:R(),r:14+R()*26,vx:2+R()*5,vy:-3-R()*4,ph:R()*6,c:['#ff2e7e','#22e6ff','#c6ff5e','#8b5cf6'][i%4]})}
if(kind=='mat'){var CH=['π','∑','√','∞','÷','×','+','−','=','x²','θ','∫','%','Δ','sin','cos','a²+b²=c²','∠','≈'];for(i=0;i<26;i++)S.push({ch:CH[i%CH.length],x:R(),y:R(),s:16+R()*34,v:6+R()*12,r:R()*6,vr:(R()-.5)*.4,a:.1+R()*.2,c:['#c6ff5e','#ffd84d','#ffffff','#5eead4'][i%4]})}
function draw(t){x.clearRect(0,0,W,H);
 if(kind=='phy'){S.forEach(function(s){x.globalAlpha=.2+.6*Math.abs(Math.sin(t*s.sp+s.ph));x.fillStyle='#fff';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,TAU);x.fill()});
  PL.forEach(function(p){var px=wr(p.x*W+t*p.v,W+240)-120,py=p.y*H,g=x.createRadialGradient(px-p.r*.3,py-p.r*.3,p.r*.1,px,py,p.r);g.addColorStop(0,p.a);g.addColorStop(1,p.b);x.globalAlpha=.5;x.fillStyle=g;x.beginPath();x.arc(px,py,p.r,0,TAU);x.fill();if(p.ring){x.strokeStyle=p.a;x.lineWidth=3;x.beginPath();x.ellipse(px,py,p.r*1.8,p.r*.45,-.4,0,TAU);x.stroke()}});
  var ax=W*.8,ay=H*.8;x.globalAlpha=.4;for(var k=0;k<3;k++){var ro=k*Math.PI/3;x.strokeStyle='#22e6ff';x.lineWidth=1.2;x.beginPath();x.ellipse(ax,ay,56,20,ro,0,TAU);x.stroke();var a=t*1.6+k*2.1,ex=ax+Math.cos(ro)*56*Math.cos(a)-Math.sin(ro)*20*Math.sin(a),ey=ay+Math.sin(ro)*56*Math.cos(a)+Math.cos(ro)*20*Math.sin(a);x.fillStyle='#fff';x.beginPath();x.arc(ex,ey,3,0,TAU);x.fill()}x.fillStyle='#ffd84d';x.beginPath();x.arc(ax,ay,6,0,TAU);x.fill();
  x.font='700 15px Cairo,sans-serif';x.textAlign='center';FS.forEach(function(f){x.globalAlpha=.22;x.fillStyle='#bfe6ff';x.fillText(f.t,f.x*W,wr(f.y*H-t*f.v,H+40)-20)})}
 if(kind=='bio'){S.forEach(function(s){var px=wr(s.x*W+t*s.vx,W+80)-40,py=wr(s.y*H+t*s.vy+Math.sin(t+s.ph)*10,H+80)-40;x.globalAlpha=.16;x.fillStyle=s.c;x.beginPath();x.arc(px,py,s.r,0,TAU);x.fill();x.globalAlpha=.45;x.strokeStyle=s.c;x.lineWidth=1.5;x.stroke();x.globalAlpha=.5;x.beginPath();x.arc(px+s.r*.15,py,s.r*.35,0,TAU);x.fill()});
  [.07,.93].forEach(function(fx,q){for(var y=0;y<H;y+=11){var ph=y*.03+t*1.2+q*3,a=Math.sin(ph)*20,d=Math.cos(ph);x.globalAlpha=.25+.2*d;x.fillStyle='#22e6ff';x.beginPath();x.arc(W*fx+a,y,2.2,0,TAU);x.fill();x.globalAlpha=.25-.2*d;x.fillStyle='#ff2e7e';x.beginPath();x.arc(W*fx-a,y,2.2,0,TAU);x.fill();if(!(y%33)){x.globalAlpha=.15;x.strokeStyle='#c6ff5e';x.lineWidth=1;x.beginPath();x.moveTo(W*fx+a,y);x.lineTo(W*fx-a,y);x.stroke()}}})}
 if(kind=='mat'){S.forEach(function(m){x.save();x.translate(m.x*W,wr(m.y*H-t*m.v,H+80)-40);x.rotate(m.r+t*m.vr);x.globalAlpha=m.a;x.fillStyle=m.c;x.font='700 '+m.s+'px Cairo,sans-serif';x.textAlign='center';x.fillText(m.ch,0,0);x.restore()});
  x.globalAlpha=.12;x.strokeStyle='#c6ff5e';x.lineWidth=2;x.beginPath();for(var px=0;px<=W;px+=6){var py=H*.5+Math.sin(px*.02+t*.8)*H*.12;px?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}
 x.globalAlpha=1}
var last=0;function lp(n){requestAnimationFrame(lp);if(n-last<34)return;last=n;draw(n/1000)}requestAnimationFrame(lp);
if(!mode)document.body.prepend(c);return c}
document.getElementById('bg').after(SUBJBG('mat',1));</script>
